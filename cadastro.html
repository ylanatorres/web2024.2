<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - Apoio Estudantil</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="root">
        <div class="container">
            <div class="sidebar">
                <div class="icon" onclick="window.location.href='index.html'">🏠</div>
                <div class="icon notification" onclick="toggleNotifications()">🔔</div>
                <div class="icon">⚙️</div>
                <div class="icon faq" onclick="toggleFAQModal()">❓</div>
            </div>
            <div class="main-content">
                <h1>Cadastro</h1>
                <form id="cadastro-form" onsubmit="handleCadastro(event)">
                    <div class="form-group">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" required />
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required />
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" required />
                    </div>
                    <div class="form-group">
                        <label for="matricula">Matrícula:</label>
                        <input type="text" id="matricula" name="matricula" required />
                    </div>
                    <div class="form-group">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" required />
                    </div>
                    <div class="form-group">
                        <label for="confirmar-senha">Confirmar Senha:</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" required />
                    </div>
                    <button type="submit" class="button">Cadastrar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
